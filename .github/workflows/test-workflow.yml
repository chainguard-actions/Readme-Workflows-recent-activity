name: Test our workflow and update live preview

on:
  push:
    branches: [ main ]
    paths:
      - "build/*.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Update README with recent activity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Add activity to readme
        uses: Readme-Workflows/recent-activity@40d98452d622b95b7e97ecd16c7ef07ba5e75a25 # main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          CONFIG_FILE: "sample.yml"
