name: 'Update README'

on:
  schedule:
    - cron: '0 */24 * * *'
  workflow_dispatch:
  #push:
  #  branches:
  #    - main

permissions:
  contents: write

jobs:
  recent-activity:
    name: 'Update README with latest activity'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: 'Update README.md from TEMPLATE.md'
        uses: Readme-Workflows/recent-activity@40d98452d622b95b7e97ecd16c7ef07ba5e75a25 # main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          CONFIG_FILE: 'sample.yml'
  metrics:
    name: 'Update SVGs for Readme stats'
    runs-on: ubuntu-latest
    needs: recent-activity
    steps:
      - uses: lowlighter/metrics@f44182260ef443309174c7c989bd43068d72643e # v3.24
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Readme-Workflows
          repo: recent-activity
          template: markdown
          filename: README.md
          markdown: TEMPLATE.md
          markdown_cache: '.github/svg_cache'
          
          base: ""
          
          config_octicon: yes
          
          plugin_stargazers: yes
          plugin_contributors: yes
