name: Update Wiki

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/**'
    branches:
      - 'main'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
    - name: Updating Wiki
      uses: Andrew-Chen-Wang/github-wiki-action@194d37ff03f5220e1baf7eb9d7c7ad7f3e1db30c # v3
      env:
        WIKI_DIR: docs/
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_MAIL: '41898282+github-actions[bot]@users.noreply.github.com'
        GH_NAME: 'github-actions[bot]'
        EXCLUDED_FILES: 'README.md'
        WIKI_PUSH_MESSAGE: '${{ github.event.commits[0].message }}'
